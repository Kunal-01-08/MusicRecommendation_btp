[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-start-music-rec"
version = "0.1.0"
description = "Cold-start music recommendation with PANNs and heterogeneous graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml", "tqdm"]

[project.optional-dependencies]
audio = ["librosa", "torchaudio", "panns-inference"]
graph = ["torch", "torch-geometric", "faiss-cpu", "scikit-learn"]
dev = ["pytest", "ruff", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
